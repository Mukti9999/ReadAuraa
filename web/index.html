  <meta charset="UTF-8">

  <link rel="manifest" href="manifest.json">
</head>
<script>
  window.readAuraSpeak = function(text, rate, pitch, volume) {
    return new Promise((resolve, reject) => {
      try {
        const synth = window.speechSynthesis;

        synth.cancel();
        synth.resume();

        const speakNow = () => {
          const utterance =
            new SpeechSynthesisUtterance(text);

          utterance.lang = "en-US";
          utterance.rate = rate;
          utterance.pitch = pitch;
          utterance.volume = volume;

          const voices = synth.getVoices();

          const femaleKeywords = [
            "female",
            "woman",
            "girl",
            "samantha",
            "karen",
            "zira",
            "jenny",
            "aria",
            "susan",
            "hazel",
            "libby",
            "sonia",
            "ava"
          ];

          let selectedVoice = null;

          for (const voice of voices) {
            const info =
              (voice.name + " " + voice.lang).toLowerCase();

            if (
              voice.lang.toLowerCase().startsWith("en") &&
              femaleKeywords.some(
                keyword => info.includes(keyword)
              )
            ) {
              selectedVoice = voice;
              break;
            }
          }

          if (!selectedVoice) {
            for (const voice of voices) {
              if (
                voice.lang
                  .toLowerCase()
                  .startsWith("en")
              ) {
                selectedVoice = voice;
                break;
              }
            }
          }

          if (selectedVoice) {
            utterance.voice = selectedVoice;
          }

          utterance.onend = function() {
            resolve(true);
          };

          utterance.onerror = function(event) {
            reject(
              event.error || "Speech synthesis error"
            );
          };

          synth.speak(utterance);
        };

        const voices = synth.getVoices();

        if (voices.length > 0) {
          speakNow();
        } else {
          let finished = false;

          const finish = () => {
            if (finished) return;
            finished = true;

            synth.removeEventListener(
              "voiceschanged",
              finish
            );

            speakNow();
          };

          synth.addEventListener(
            "voiceschanged",
            finish
          );

          setTimeout(finish, 1000);
        }
      } catch (error) {
        reject(error);
      }
    });
  };

  window.readAuraStop = function() {
    window.speechSynthesis.cancel();
  };

  window.readAuraPause = function() {
    window.speechSynthesis.pause();
  };

  window.readAuraResume = function() {
    window.speechSynthesis.resume();
  };
</script>
